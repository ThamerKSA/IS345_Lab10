<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Login - IS345 Book Store</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; }
        .box { width: 300px; margin: 80px auto; background: white; padding: 25px; border-radius: 8px; }
        h2 { color: darkorange; text-align: center; }
        input { width: 100%; padding: 8px; margin: 6px 0; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: orange; color: white; border: none; border-radius: 4px; }
        #msg { text-align: center; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Welcome to IS345 Book Store</h2>
        <form id="loginForm">
            <input id="username" placeholder="Username" required />
            <input id="password" type="password" placeholder="Password" required />
            <button type="submit">Login</button>
        </form>
        <p id="msg"></p>
    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", async function (e) {
            e.preventDefault();
            const res = await fetch("/api/Users/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    username: document.getElementById("username").value,
                    password: document.getElementById("password").value
                })
            });
            const data = await res.json();
            document.getElementById("msg").innerText = data.message;
        });
    </script>
</body>
</html>
